<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Nikki</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@300;400;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
</head>
<body>
    <div class="container">
        <header>
            <span class="name">NIKKI</span>
            <span class="status" id="status">connecting...</span>
        </header>

        <main>
            <div class="orb-wrapper">
                <div class="orb" id="orb">
                    <div class="orb-inner"></div>
                    <div class="orb-ring"></div>
                    <div class="orb-ring ring2"></div>
                </div>
            </div>

            <div class="mic-area">
                <button class="mic-btn" id="micBtn" disabled>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <line x1="12" y1="19" x2="12" y2="23"/>
                        <line x1="8" y1="23" x2="16" y2="23"/>
                    </svg>
                </button>
                <p class="mic-hint" id="micHint">hold to speak</p>
            </div>
        </main>

        <div class="transcript" id="transcript">
            <div class="transcript-inner" id="transcriptInner"></div>
        </div>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
